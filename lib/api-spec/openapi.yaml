openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Buyer quotation enquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quotes:
    post:
      operationId: submitQuote
      tags: [quotes]
      summary: Submit a quotation enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteEnquiryInput"
      responses:
        "201":
          description: Enquiry saved for the sales team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEnquiryReceipt"
        "400":
          description: Invalid or spam submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Enquiry could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteEnquiryInput:
      type: object
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        companyName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        country: { type: string, minLength: 2, maxLength: 100 }
        productInterest: { type: string, minLength: 1, maxLength: 160 }
        requiredQuantity: { type: string, minLength: 1, maxLength: 120 }
        packaging: { type: string, minLength: 1, maxLength: 200 }
        targetPrice: { type: string, maxLength: 120 }
        deliveryLocation: { type: string, minLength: 2, maxLength: 160 }
        message: { type: string, maxLength: 3000 }
        honeypot: { type: string, maxLength: 0 }
        formStartedAt: { type: integer, minimum: 1 }
      required:
        - fullName
        - companyName
        - email
        - phone
        - country
        - productInterest
        - requiredQuantity
        - packaging
        - deliveryLocation
        - honeypot
        - formStartedAt
    QuoteEnquiryReceipt:
      type: object
      properties:
        enquiryId: { type: integer }
        message: { type: string }
      required: [enquiryId, message]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

